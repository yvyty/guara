[package]
name = "guara"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
guara-core = { path = "../guara-core" }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
indicatif = "0.17"
ctrlc = "3"
ratatui = "0.30"
crossterm = "0.29"

[features]
default = []
# Forward the opt-in deep-scanner features to the core crate.
security-clamav = ["guara-core/security-clamav"]
security-yara = ["guara-core/security-yara"]
security-hash = ["guara-core/security-hash"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
