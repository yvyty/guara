[package]
name = "guara-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core engine for Guará: filesystem search, index, watch, IPC, and security heuristics"
readme = "../../README.md"

[dependencies]
ignore = "0.4"
rayon = "1"
tracing = "0.1"
regex = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
mime_guess = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
sha2 = { version = "0.10", optional = true }
yara-x = { version = "1.20", optional = true }

[features]
default = []
security-clamav = []
security-yara = ["dep:yara-x"]
security-hash = ["dep:sha2"]

[dev-dependencies]
tempfile = "3"
# Property tests for regex flags, glob parsing, and size/date parsing
proptest = "1"
